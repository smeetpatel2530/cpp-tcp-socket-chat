name: C++ CI (Ubuntu)

on: [push, pull_request]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build
        run: mkdir build && cd build && cmake .. && make
